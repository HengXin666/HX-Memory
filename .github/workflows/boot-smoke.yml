# boot-smoke - 真机 DSH 行为门禁: 装进隔离 DSH_HOME, 启动 web host, 断言面板/RPC/注入链路。
# 只断言"进程没崩"是不够的: 插件组可以加载成功而面板 404、fiber 可以是 active 而服务不可见。
# 因此这里跑 scripts/smoke-dsh.sh, 逐条断言 profile 组合、fiber 状态、RPC 200、bundle 模块 id。
name: boot-smoke
on: [push, pull_request]
jobs:
  build:
    name: Build plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:client
      - run: pnpm exec tsc --noEmit
      - uses: actions/upload-artifact@v4
        with:
          name: hx-memory-pkg
          path: |
            package.json
            dist/
            dsh/
            README.md
            docs/
  smoke:
    name: DSH behavior smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hx-memory-pkg
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # dsh plugin 是 pnpm 转发器 (spawnSync("pnpm")) —— runner 镜像不预装 pnpm。
      - uses: pnpm/action-setup@v4
        with:
          version: "10.10.0"
      # 版本必须与 package.json 的 peerDependencies 一致, 否则测的是一个不受支持的组合。
      - run: npm install -g @deepseek-ai/dsh@0.1.2-rc.1
      - name: Run behavior smoke
        run: bash scripts/smoke-dsh.sh "$PWD/pkg"
