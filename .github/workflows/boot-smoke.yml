# boot-smoke - verify HX-Memory install does not break DSH boot (runs fully in CI).
name: boot-smoke
on: [push, pull_request]
jobs:
  build:
    name: Build plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:client
      - run: pnpm exec tsc --noEmit
      - uses: actions/upload-artifact@v4
        with:
          name: hx-memory-pkg
          path: |
            package.json
            dist/
            dsh/
            README.md
  boot:
    name: DSH boot smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: dsh-home
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hx-memory-pkg
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: npm install -g @deepseek-ai/dsh@0.1.1-rc.2
      - name: Install hx-memory into fresh web profile
        run: |
          dsh plugin --profile web add "file:$(pwd)/pkg" 2>&1 | tail -5
      - name: Assert plugin group composes
        run: |
          dsh --profile web --dump-config > tree.txt 2>&1 || true
          grep -q "hx-memory" tree.txt && echo "OK group present" || (echo "FAIL group missing"; cat tree.txt; exit 1)
      - name: Boot web host, assert no plugin crash
        run: |
          set +e
          timeout 60 dsh web > web-boot.log 2>&1 &
          BOOT_PID=$!
          sleep 25
          if kill -0 $BOOT_PID 2>/dev/null; then echo "OK alive"; ALIVE=1; else echo "exited"; ALIVE=0; fi
          FAIL_MARKERS="plugin tree failed to load|failed to apply loader entry|invalid plugin|Cannot destructure"
          if grep -qE "$FAIL_MARKERS" web-boot.log; then echo "FAIL crash markers:"; grep -E "$FAIL_MARKERS" web-boot.log | head; kill $BOOT_PID 2>/dev/null; exit 1; fi
          if grep -q "MISSING_CREDENTIAL" web-boot.log; then echo "note: reached credential stage (boot OK)"; fi
          if [ "$ALIVE" = "1" ]; then kill $BOOT_PID 2>/dev/null; wait $BOOT_PID 2>/dev/null; fi
          echo "=== boot log ==="; head -15 web-boot.log; echo "=== PASS ==="
