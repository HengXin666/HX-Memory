# release - 发行 HX-Memory 的可安装版本 (npm pack tarball -> GitHub Packages + GitHub Release)
# 用法: Actions -> release -> Run workflow (手动), 或打 vX.Y.Z tag 触发
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "version bump: patch/minor/major"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  verify:
    name: Verify + build + pack + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/verify.sh
      - run: pnpm run build
      - run: pnpm run build:client
      - name: Compute version
        id: ver
        # 必须用 env: 传 BUMP, 不能在 run 里把 "BUMP=minor" 单独写一行 ——
        # 那只是 shell 变量, 不会 export 给子进程; calc-version.cjs 读不到就静默回退成 patch。
        # **真实踩过**: 选了 minor 却发布了 v0.1.3 (见 Agent Note)。
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VER=$(node .github/scripts/calc-version.cjs)
          echo "bump=${BUMP:-patch} version=$VER"
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Write version into package.json
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ steps.ver.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Pack tarball
        run: |
          mkdir -p dist-artifact
          npm pack --pack-destination ./dist-artifact
          ls -la dist-artifact/
      - name: Configure npm auth for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com/"
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "user/packages/npm/@hengxin666%2Fhx-memory" -f visibility=public || echo "(visibility handled or needs manual check)"
      - uses: actions/upload-artifact@v4
        with:
          name: hx-memory-tarball
          path: "dist-artifact/*.tgz"
  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hx-memory-tarball
          path: artifact
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifact/
          TGZ=$(ls artifact/*.tgz | head -1)
          VERSION=$(basename "$TGZ" | sed -E "s/.*-([0-9]+\.[0-9]+\.[0-9]+)\.tgz$/\1/")
          echo "releasing v$VERSION"
          cat > /tmp/notes.md <<'EOF'
          ## HX-Memory 可安装包
          
          **安装**:
          1. 下载本 Release 的 .tgz 文件
          2. dsh plugin --profile <profile> add file:<下载的 .tgz>
          3. 或 (已发布到 GitHub Packages): dsh plugin --profile <profile> add @hengxin666/hx-memory
          4. 重启 DSH, 设置区出现 记忆审阅 / 记忆绑定 / 调用记录 面板
          
          由 release 流水线构建+验证后打包并发布到 GitHub Packages (public)。
          EOF
          gh release create "v$VERSION" "$TGZ" --title "HX-Memory v$VERSION" --notes-file /tmp/notes.md
