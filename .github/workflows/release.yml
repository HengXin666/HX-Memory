# release - 发行 HX-Memory 的可安装版本 (npm pack tarball -> GitHub Packages + GitHub Release)
# 用法: Actions -> release -> Run workflow (手动), 或打 vX.Y.Z tag 触发
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "version bump: patch/minor/major"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  verify:
    name: Verify + build + pack + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/verify.sh
      - run: pnpm run build
      - run: pnpm run build:client
      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER=${GITHUB_REF#refs/tags/v}
          else
            BUMP=${{ inputs.bump }}
            cat > /tmp/calc-version.cjs <<'NODEEOF'
            const fs = require('fs');
            const { execSync } = require('child_process');
            let base = null;
            try {
              const out = execSync('npm view @hengxin666/hx-memory versions --json 2>/dev/null || echo "[]"').toString();
              const versions = JSON.parse(out);
              const arr = Array.isArray(versions) ? versions : [];
              const nums = arr.filter(function(x){ return /^\d+\.\d+\.\d+$/.test(x); })
                .map(function(x){ return x.split('.').map(Number); });
              nums.sort(function(x,y){ return x[0]-y[0] || x[1]-y[1] || x[2]-y[2]; });
              if (nums.length) base = nums[nums.length-1];
            } catch (e) { base = null; }
            if (!base) {
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              base = p.version.split('.').map(Number);
            }
            const a = base[0], b = base[1], c = base[2];
            const k = (process.env.BUMP || 'patch').toLowerCase();
            let v;
            if (k === 'major') v = (a + 1) + '.0.0';
            else if (k === 'minor') v = a + '.' + (b + 1) + '.0';
            else v = a + '.' + b + '.' + (c + 1);
            process.stdout.write(v);
            NODEEOF
            VER=$(node /tmp/calc-version.cjs)
          fi
          echo "version=$VER"
          echo "version=$VER" >> $GITHUB_OUTPUT