# boot-smoke — 保证"装上 HX-Memory 后 DSH 仍能正常启动"。
#
# 背景 (用户痛点): 很多插件装上后导致 DeepSeek Harness 直接无法启动。
# 本工作流在全新 GitHub runner 上做真机启动冒烟: 装 dsh → 建 web profile →
# 装本插件 → 启动 web → 断言没有插件加载崩溃, 进程存活/越过插件初始化。
#
# 设计要点:
#  - 完全在 CI 跑, 不碰任何本地环境。
#  - 用 web profile (插件真正运行的宿主), 不用 headless one-shot
#    (headless 对任意 bundle.patch 插件组都会挂起, 会误报)。
#  - 无模型 key 也能测: 只断言"启动没被插件搞崩"; 出现 MISSING_CREDENTIAL
#    反而说明已越过插件初始化阶段。
#  - 失败标记 (真实启动错误): plugin tree failed to load /
#    failed to apply loader entry / invalid plugin / Cannot destructure

name: boot-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "boot-smoke-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:client
      - run: pnpm exec tsc --noEmit
      - uses: actions/upload-artifact@v4
        with:
          name: hx-memory-pkg
          path: |
            package.json
            dist/
            dsh/
            README.md

  boot:
    name: DSH boot smoke (web profile + hx-memory)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: "${{ runner.temp }}/dsh-home"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hx-memory-pkg
          path: pkg

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DeepSeek Harness (pinned)
        run: |
          npm install -g @deepseek-ai/dsh@0.1.1-rc.2
          dsh --version || true

      - name: Install hx-memory into fresh web profile
        run: |
          mkdir -p "$DSH_HOME"
          dsh plugin --profile web add "file:$(pwd)/pkg" 2>&1 | tail -5
          echo "--- profile node_modules ---"
          ls "$DSH_HOME/profiles/web/node_modules/@hx/" 2>&1 || echo "(not found)"

      - name: Assert plugin group composes (--dump-config)
        run: |
          dsh --profile web --dump-config > /tmp/tree.txt 2>&1
          if ! grep -q "hx-memory" /tmp/tree.txt; then
            echo "FAIL: hx-memory group missing from composed tree"
            cat /tmp/tree.txt
            exit 1
          fi
          echo "OK: hx-memory group present in composed plugin tree"

      - name: Boot web host and assert no plugin-load crash
        run: |
          set +e
          timeout 60 dsh web > /tmp/web-boot.log 2>&1 &
          BOOT_PID=$!
          sleep 25
          if kill -0 $BOOT_PID 2>/dev/null; then
            echo "OK: web process alive after 25s (plugin did not crash startup)"
            ALIVE=1
          else
            echo "web process exited during startup window"
            ALIVE=0
          fi
          FAIL_MARKERS="plugin tree failed to load|failed to apply loader entry|invalid plugin|Cannot destructure"
          if grep -qE "$FAIL_MARKERS" /tmp/web-boot.log; then
            echo "FAIL: plugin-load crash markers found in boot log:"
            grep -E "$FAIL_MARKERS" /tmp/web-boot.log | head -10
            kill $BOOT_PID 2>/dev/null
            exit 1
          fi
          if grep -q "MISSING_CREDENTIAL" /tmp/web-boot.log; then
            echo "note: reached model-credential stage (boot OK, no model key in CI)"
          fi
          if [ "$ALIVE" = "1" ]; then
            kill $BOOT_PID 2>/dev/null
            wait $BOOT_PID 2>/dev/null
          fi
          echo "=== boot log (head) ==="
          head -20 /tmp/web-boot.log
          echo "=== boot smoke PASS ==="
